<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Printer status | NatCut</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: light-dark(#f2f1eb, #131512);
      --surface: light-dark(#fffef8, #1c201b);
      --text: light-dark(#171a16, #f1f5ed);
      --muted: light-dark(#5a6258, #aeb8aa);
      --border: light-dark(#cbd0c7, #3e493b);
      --accent: light-dark(#155f3a, #71d99d);
      --accent-text: light-dark(#ffffff, #082314);
      --danger: light-dark(#a52822, #ff938c);
      --shadow: 0 18px 50px light-dark(rgb(24 32 24 / 10%), rgb(0 0 0 / 30%));
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 16px;
    }

    * { box-sizing: border-box; }

    body {
      min-block-size: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--text);
    }

    header,
    main {
      inline-size: min(100% - 2rem, 58rem);
      margin-inline: auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1.5rem 1rem;
    }

    .wordmark {
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .mode {
      color: var(--muted);
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main { padding-block: clamp(1.5rem, 6vw, 5rem); }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 1.5rem;
      margin-block-end: 2rem;
    }

    h1 {
      max-inline-size: 12ch;
      margin: 0;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      font-size: clamp(2.4rem, 8vw, 5.4rem);
      font-weight: 700;
      letter-spacing: -0.07em;
      line-height: 0.92;
    }

    button {
      min-block-size: 2.75rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--text);
      border-radius: 999px;
      background: var(--text);
      color: var(--background);
      font: inherit;
      font-weight: 700;
    }

    button:hover { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    button:disabled { opacity: 0.55; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .state-line {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1.25rem;
      border-block-end: 1px solid var(--border);
    }

    .indicator {
      inline-size: 0.75rem;
      block-size: 0.75rem;
      flex: none;
      border-radius: 50%;
      background: var(--muted);
    }

    .indicator[data-state="ready"] { background: var(--accent); }
    .indicator[data-state="error"] { background: var(--danger); }

    #connection {
      margin: 0;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
    }

    #message {
      margin-inline-start: auto;
      color: var(--muted);
      font-size: 0.8125rem;
      text-align: end;
    }

    dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: 0;
    }

    .datum {
      min-inline-size: 0;
      padding: 1.25rem;
      border-block-end: 1px solid var(--border);
    }

    .datum:nth-child(odd) { border-inline-end: 1px solid var(--border); }
    .datum:nth-last-child(-n + 2) { border-block-end: 0; }

    dt {
      margin-block-end: 0.35rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    dd {
      overflow-wrap: anywhere;
      margin: 0;
      font-variant-numeric: tabular-nums;
    }

    .error { color: var(--danger); }

    @media (max-width: 36rem) {
      .masthead { grid-template-columns: 1fr; align-items: start; }
      .masthead button { justify-self: start; }
      .state-line { align-items: flex-start; flex-wrap: wrap; }
      #message { inline-size: 100%; margin-inline-start: 1.5rem; text-align: start; }
      dl { grid-template-columns: 1fr; }
      .datum:nth-child(odd) { border-inline-end: 0; }
      .datum:nth-last-child(2) { border-block-end: 1px solid var(--border); }
    }

    @media (pointer: coarse) {
      button { min-block-size: 3rem; }
    }

    @media (prefers-reduced-motion: no-preference) {
      button { transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease; }
    }
  </style>
</head>
<body>
  <header>
    <span class="wordmark">NatCut</span>
    <span class="mode">Read-only bridge</span>
  </header>
  <main>
    <div class="masthead">
      <h1>Printer status</h1>
      <button id="refresh" type="button">Refresh status</button>
    </div>

    <section class="panel" aria-labelledby="connection">
      <div class="state-line">
        <span class="indicator" id="indicator" aria-hidden="true"></span>
        <h2 id="connection">Checking connection</h2>
        <span id="message" role="status" aria-live="polite"></span>
      </div>
      <dl aria-busy="true" id="details">
        <div class="datum"><dt>Model</dt><dd id="model">—</dd></div>
        <div class="datum"><dt>SKU</dt><dd id="sku">—</dd></div>
        <div class="datum"><dt>Firmware</dt><dd id="firmware">—</dd></div>
        <div class="datum"><dt>Hardware</dt><dd id="hardware">—</dd></div>
        <div class="datum"><dt>Printer state</dt><dd id="printer-state">—</dd></div>
        <div class="datum"><dt>Active jobs</dt><dd id="active-jobs">—</dd></div>
      </dl>
    </section>
  </main>

  <script type="module">
    const fields = {
      connection: document.querySelector('#connection'),
      message: document.querySelector('#message'),
      indicator: document.querySelector('#indicator'),
      details: document.querySelector('#details'),
      model: document.querySelector('#model'),
      sku: document.querySelector('#sku'),
      firmware: document.querySelector('#firmware'),
      hardware: document.querySelector('#hardware'),
      printerState: document.querySelector('#printer-state'),
      activeJobs: document.querySelector('#active-jobs'),
    };
    const refreshButton = document.querySelector('#refresh');

    function setText(element, value) {
      element.textContent = value ?? '—';
    }

    async function refreshStatus() {
      refreshButton.disabled = true;
      fields.details.setAttribute('aria-busy', 'true');
      fields.message.textContent = '';
      try {
        const response = await fetch('/api/printer', {
          cache: 'no-store',
          signal: AbortSignal.timeout(35_000),
        });
        const body = await response.json();
        if (!response.ok || !body.ok) throw new Error(body.error?.message ?? `Status request failed (${response.status})`);

        const { identity, status, activeJobs } = body.snapshot;
        fields.connection.textContent = `${status.label} / ${status.subLabel}`;
        fields.connection.classList.remove('error');
        fields.indicator.dataset.state = status.alerts.length ? 'error' : 'ready';
        setText(fields.model, identity.model);
        setText(fields.sku, identity.sku);
        setText(fields.firmware, identity['firmware-revision']);
        setText(fields.hardware, identity['hardware-revision']);
        setText(fields.printerState, `${status.state} / ${status.sub}`);
        setText(fields.activeJobs, activeJobs.length ? activeJobs.join(', ') : 'None');
        fields.message.textContent = status.alerts.length ? `Alerts: ${status.alerts.join(', ')}` : 'No alerts';
      } catch (error) {
        const message = error.name === 'TimeoutError' ? 'Status request timed out. Try again.' : error.message;
        fields.connection.textContent = 'Unavailable';
        fields.connection.classList.add('error');
        fields.indicator.dataset.state = 'error';
        fields.message.textContent = message;
      } finally {
        fields.details.setAttribute('aria-busy', 'false');
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener('click', refreshStatus);
    refreshStatus();
  </script>
</body>
</html>
